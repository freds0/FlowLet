# @package _global_

# Fine-tuning FlowLet on OpenBHB from FOMO60k pretrained checkpoint
#
# This configuration loads a pretrained model from FOMO60k and fine-tunes
# it on the OpenBHB dataset for improved brain age prediction.
#
# Usage:
#   python flowlet/train.py experiment=flowlet_openbhb_finetune \
#     ckpt_path=/path/to/fomo60k/checkpoint.ckpt \
#     data.data_dir=/path/to/openbhb/data \
#     data.metadata_file=/path/to/openbhb/metadata.csv

defaults:
  - override /data: openbhb
  - override /model: flowlet
  - override /callbacks: default
  - override /logger: wandb
  - override /trainer: gpu

# Task name
task_name: "openbhb_finetune"
run_name: "openbhb_finetune_${now:%Y%m%d_%H%M%S}"

# Enable training and testing
train: true
test: true

# Checkpoint path (REQUIRED - provide via command line)
# Example: ckpt_path=/path/to/fomo60k_checkpoint.ckpt
ckpt_path: null

# Random seed
seed: 42

# Tags for experiment tracking
tags: ["openbhb", "finetune", "brain-age", "3d-mri"]

# Trainer configuration
trainer:
  # Fine-tuning epochs (fewer than pretraining)
  max_epochs: 100

  # Validation frequency
  check_val_every_n_epoch: 2

  # Precision
  precision: 16-mixed

  # Gradient clipping
  gradient_clip_val: 1.0

  # Gradient accumulation (effective batch size = batch_size * accumulate_grad_batches)
  accumulate_grad_batches: 4  # Effective batch size: 2 * 4 = 8

  # Accelerator
  accelerator: gpu
  devices: 1

  # Deterministic mode
  deterministic: false

# Data configuration
data:
  # Batch size (keep small for 3D volumes)
  batch_size: 2

  # Augmentation
  augment_train: true
  augment_val: false

  # Memory
  cache_data: false

  # Workers
  num_workers: 4

# Model configuration
model:
  # Learning rate (lower for fine-tuning)
  learning_rate: 5e-5  # 10x lower than pretraining (was 1e-4)

  # Weight decay
  weight_decay: 0.01

  # Scheduler
  scheduler_type: "cosine"
  warmup_steps: 500  # Shorter warmup for fine-tuning

  # Regularization
  dropout: 0.1

  # Sampling (for visualization during validation)
  n_sample_steps: 32

  # Age normalization (will be updated from data if needed)
  age_min: 18.0
  age_max: 90.0

# Callbacks
callbacks:
  model_checkpoint:
    dirpath: ${paths.output_dir}/checkpoints
    filename: openbhb_finetune_epoch_{epoch:03d}
    monitor: val/loss
    mode: min
    save_top_k: 5
    save_last: true
    every_n_epochs: 1
    auto_insert_metric_name: true

  early_stopping:
    monitor: val/loss
    patience: 15
    mode: min
    min_delta: 0.001

# Logger configuration
logger:
  wandb:
    project: "flowlet-openbhb"
    name: "finetune_${now:%Y-%m-%d_%H-%M-%S}"
    tags: ${tags}
    notes: "Fine-tuning FlowLet on OpenBHB from FOMO60k pretrained weights"
    log_model: true  # Log model checkpoints to W&B

    # Log hyperparameters
    save_dir: ${paths.log_dir}

# Additional notes
#
# Fine-tuning best practices:
# 1. Use lower learning rate (5e-5) than pretraining
# 2. Shorter warmup period (500 steps)
# 3. Fewer epochs (100 vs 500)
# 4. Keep augmentation enabled
# 5. Monitor validation loss closely
# 6. Early stopping to prevent overfitting
#
# Memory optimization:
# - batch_size=2 with accumulate_grad_batches=4
# - Effective batch size: 8
# - Use mixed precision (16-mixed)
# - cache_data=false (unless you have >32GB RAM)
#
# Expected behavior:
# - Initial validation loss should be reasonable (model is pretrained)
# - Loss should decrease quickly in first few epochs
# - Convergence typically within 50-100 epochs
