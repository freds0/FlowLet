# @package _global_

# FlowLetLarge FOMO60k Dataset Experiment
# Training FlowLetLarge on FOMO60k brain MRI dataset (369 volumes)
# Requires 24+ GB VRAM (A100 80GB, H100 recommended)
#
# Usage:
#   python flowlet/train.py experiment=flowlet_fomo60k_large

defaults:
  - override /data: fomo60k
  - override /model: flowlet
  - override /callbacks: default
  - override /trainer: gpu
  - override /logger: wandb

task_name: "flowlet_fomo60k_large"
run_name: "fomo60k_large_v1"

tags: ["flowlet", "flowlet-large", "fomo60k", "brain_mri"]

train: true
test: true

trainer:
  max_epochs: 500
  check_val_every_n_epoch: 5
  precision: 16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4  # Effective batch size = 4 * batch_size = 8
  accelerator: gpu
  devices: 1

# Data configuration for FOMO60k
data:
  data_dir: /home/fred/Projetos/FlowLet/FOMO60k
  train_metadata: null  # Auto-discover .npy files
  target_shape: [128, 128, 128]
  age_range: [18.0, 90.0]
  batch_size: 2
  num_workers: 4
  val_split: 0.1
  test_split: 0.05
  augment_train: true
  use_numpy: true

# Model configuration - FlowLetLarge
model:
  _target_: flowlet.flowlet.FlowLetLarge
  model_size: "large"
  volume_shape: [128, 128, 128]
  hidden_dims: [64, 128, 256, 512, 512]  # 5-level U-Net
  wavelet: 'db4'
  wavelet_level: 3
  time_embed_dim: 512
  cond_embed_dim: 128
  num_res_blocks: 3         # More residual blocks per level
  attention_levels: [2, 3, 4]  # Attention at 3 levels
  dropout: 0.1              # Regularization for larger model
  n_sample_steps: 32
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 1000        # Longer warmup for larger model
  scheduler_type: "cosine"
  age_min: 18.0
  age_max: 90.0

callbacks:
  model_checkpoint:
    monitor: "val/loss"
    mode: "min"
    save_top_k: 3
    save_last: true
