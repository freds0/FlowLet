# @package _global_

# FlowLet Synthetic Data Experiment
# For testing and debugging without real MRI data

defaults:
  - override /data: synthetic_mri
  - override /model: flowlet
  - override /callbacks: default
  - override /trainer: gpu

task_name: "flowlet_synthetic"
run_name: "synthetic_test"

tags: ["flowlet", "synthetic", "test"]

train: true
test: true

trainer:
  max_epochs: 100
  check_val_every_n_epoch: 10
  precision: 16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1

# Smaller model for testing
model:
  volume_shape: [64, 64, 64]
  hidden_dims: [32, 64, 128]
  wavelet_level: 2
  time_embed_dim: 128
  cond_embed_dim: 32
  num_res_blocks: 1
  attention_levels: []  # No attention for speed
  n_sample_steps: 16
  learning_rate: 2e-4
  model_size: "small"
  age_min: 18.0
  age_max: 90.0
