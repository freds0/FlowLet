# @package _global_

# FlowLet OASIS Dataset Experiment
# Training on OASIS-3 brain MRI dataset

defaults:
  - override /data: brain_mri
  - override /model: flowlet
  - override /callbacks: default
  - override /trainer: gpu

task_name: "flowlet_oasis"
run_name: "oasis_v1"

tags: ["flowlet", "oasis", "brain_mri"]

train: true
test: true

trainer:
  max_epochs: 500
  check_val_every_n_epoch: 5
  precision: 16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4  # Effective batch size = 4 * batch_size

# Data configuration for OASIS
data:
  data_dir: /path/to/OASIS3/processed     # UPDATE THIS PATH
  train_metadata: /path/to/OASIS3/participants.csv  # UPDATE THIS PATH
  target_shape: [128, 128, 128]
  age_range: [42.0, 95.0]  # OASIS-3 age range
  batch_size: 4
  num_workers: 8
  val_split: 0.1
  augment_train: true

# Model configuration
model:
  volume_shape: [128, 128, 128]
  hidden_dims: [64, 128, 256, 512]
  wavelet: 'db4'
  wavelet_level: 3
  time_embed_dim: 256
  cond_embed_dim: 64
  num_res_blocks: 2
  attention_levels: [2, 3]
  dropout: 0.1
  n_sample_steps: 32
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 1000
  scheduler_type: "cosine"
  age_min: 42.0
  age_max: 95.0
  model_size: "base"

callbacks:
  model_checkpoint:
    monitor: "val/loss"
    mode: "min"
    save_top_k: 3
    save_last: true
