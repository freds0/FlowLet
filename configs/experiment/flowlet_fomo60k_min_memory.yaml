# @package _global_

# FlowLet FOMO60k Low Memory Experiment
# Training on FOMO60k with reduced memory footprint (8-12GB GPUs)

defaults:
  - override /data: fomo60k
  - override /model: flowlet
  - override /callbacks: default
  - override /trainer: gpu

task_name: "flowlet_fomo60k_min_mem"
run_name: "fomo60k_low_mem"

tags: ["flowlet", "fomo60k", "brain_mri", "low_memory"]

train: true
test: true

trainer:
  max_epochs: 500
  check_val_every_n_epoch: 10
  precision: 16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 8  # Higher accumulation for smaller batches

# Data configuration for FOMO60k (reduced memory)
data:
  data_dir: /home/fred/Projetos/FlowLet/FOMO60k
  train_metadata: null
  target_shape: [96, 96, 96]  # Smaller volume
  age_range: [18.0, 90.0]
  batch_size: 1               # Minimum batch size
  num_workers: 2
  val_split: 0.1
  test_split: 0.05
  augment_train: true
  use_numpy: true

# Model configuration (reduced size)
model:
  volume_shape: [96, 96, 96]
  hidden_dims: [32, 64, 128, 256]  # Fewer channels
  wavelet: 'db2'                   # Smaller wavelet
  wavelet_level: 2                 # Fewer levels
  time_embed_dim: 128
  cond_embed_dim: 32
  num_res_blocks: 1
  attention_levels: []             # No attention (saves memory)
  dropout: 0.1
  n_sample_steps: 32
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 300
  scheduler_type: "cosine"
  age_min: 18.0
  age_max: 90.0
  model_size: "small"

callbacks:
  model_checkpoint:
    monitor: "val/loss"
    mode: "min"
    save_top_k: 2
    save_last: true
