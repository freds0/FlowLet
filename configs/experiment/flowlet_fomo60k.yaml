# @package _global_

# FlowLet FOMO60k Dataset Experiment
# Training on FOMO60k brain MRI dataset (369 volumes)

defaults:
  - override /data: fomo60k
  - override /model: flowlet
  - override /callbacks: default
  - override /trainer: gpu

task_name: "flowlet_fomo60k"
run_name: "fomo60k_v1"

tags: ["flowlet", "fomo60k", "brain_mri"]

train: true
test: true

trainer:
  max_epochs: 500
  check_val_every_n_epoch: 5
  precision: 16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4  # Effective batch size = 4 * batch_size

# Data configuration for FOMO60k
data:
  data_dir: /home/fred/Projetos/FlowLet/FOMO60k
  train_metadata: null  # Auto-discover .npy files
  target_shape: [128, 128, 128]
  age_range: [18.0, 90.0]
  batch_size: 2
  num_workers: 4
  val_split: 0.1
  test_split: 0.05
  augment_train: true
  use_numpy: true

# Model configuration
model:
  volume_shape: [128, 128, 128]
  hidden_dims: [64, 128, 256, 512]
  wavelet: 'db4'
  wavelet_level: 3
  time_embed_dim: 256
  cond_embed_dim: 64
  num_res_blocks: 2
  attention_levels: [2, 3]
  dropout: 0.1
  n_sample_steps: 32
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 500
  scheduler_type: "cosine"
  age_min: 18.0
  age_max: 90.0
  model_size: "base"

callbacks:
  model_checkpoint:
    monitor: "val/loss"
    mode: "min"
    save_top_k: 3
    save_last: true
