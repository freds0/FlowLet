# @package _global_

# FlowLet Minimum Memory Experiment
# For training on GPUs with limited memory (8-12GB)

defaults:
  - override /data: brain_mri
  - override /model: flowlet
  - override /callbacks: default
  - override /trainer: gpu

task_name: "flowlet_min_memory"
run_name: "low_mem"

tags: ["flowlet", "low_memory", "small"]

train: true
test: true

trainer:
  max_epochs: 500
  check_val_every_n_epoch: 10
  precision: 16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 8  # Compensate for small batch

# Data - smaller volumes
data:
  data_dir: ???
  train_metadata: ???
  target_shape: [96, 96, 96]  # Smaller volume
  batch_size: 1               # Minimum batch size
  num_workers: 2
  val_split: 0.1
  augment_train: true
  cache_data: false

# Model - minimal configuration
model:
  volume_shape: [96, 96, 96]
  hidden_dims: [32, 64, 128, 256]  # Smaller channels
  wavelet: 'db2'                   # Smaller wavelet filter
  wavelet_level: 2                 # Fewer decomposition levels
  time_embed_dim: 128
  cond_embed_dim: 32
  num_res_blocks: 1
  attention_levels: []             # No attention to save memory
  dropout: 0.0
  n_sample_steps: 16
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_steps: 500
  model_size: "small"
