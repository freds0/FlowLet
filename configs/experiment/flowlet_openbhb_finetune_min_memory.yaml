# @package _global_

# Fine-tuning FlowLet on OpenBHB - MINIMAL MEMORY CONFIGURATION
#
# This configuration is optimized for GPUs with limited VRAM (8GB or less).
# Uses aggressive memory optimizations at the cost of slower training.
#
# Memory optimizations:
# - batch_size=1 (minimum)
# - gradient_accumulation=8 (effective batch=8)
# - target_shape=[96,96,96] (smaller volumes)
# - cache_data=false
# - num_workers=2
# - precision=16-mixed
#
# Usage:
#   python flowlet/train.py experiment=flowlet_openbhb_finetune_min_memory \
#     ckpt_path=/path/to/fomo60k_checkpoint.ckpt \
#     data.data_dir=/path/to/openbhb/data \
#     data.metadata_file=/path/to/openbhb/metadata.csv

defaults:
  - override /data: openbhb
  - override /model: flowlet
  - override /callbacks: default
  - override /logger: tensorboard  # TensorBoard uses less memory than W&B
  - override /trainer: gpu

# Task name
task_name: "openbhb_finetune_min_memory"
run_name: "openbhb_min_mem_${now:%Y%m%d_%H%M%S}"

# Enable training and testing
train: true
test: true

# Checkpoint path (REQUIRED)
ckpt_path: null

# Random seed
seed: 42

# Tags
tags: ["openbhb", "finetune", "min-memory"]

# Trainer configuration
trainer:
  # Fine-tuning epochs
  max_epochs: 100

  # Validation frequency (less frequent to save memory/time)
  check_val_every_n_epoch: 5

  # Precision
  precision: 16-mixed

  # Gradient clipping
  gradient_clip_val: 1.0

  # Gradient accumulation (IMPORTANT: compensates for batch_size=1)
  accumulate_grad_batches: 8  # Effective batch size: 1 * 8 = 8

  # Single GPU
  accelerator: gpu
  devices: 1

  # Limit validation batches (faster validation)
  limit_val_batches: 50

  # Deterministic
  deterministic: false

# Data configuration (MEMORY OPTIMIZED)
data:
  # Smaller volumes to reduce memory
  target_shape: [96, 96, 96]  # Down from 128³

  # Minimum batch size
  batch_size: 1

  # Augmentation
  augment_train: true
  augment_val: false

  # Memory
  cache_data: false  # NEVER cache with limited memory

  # Fewer workers
  num_workers: 2

  # Splits
  val_split: 0.1
  test_split: 0.1

  # Pin memory
  pin_memory: true

# Model configuration
model:
  # Learning rate (lower for fine-tuning)
  learning_rate: 5e-5

  # Weight decay
  weight_decay: 0.01

  # Scheduler
  scheduler_type: "cosine"
  warmup_steps: 500

  # Dropout (light regularization)
  dropout: 0.1

  # Sampling steps (fewer to save memory during validation)
  n_sample_steps: 16  # Down from 32

  # Model size (use default, not large)
  # For even more memory savings, consider using Small model:
  # _target_: flowlet.flowlet.FlowLetSmall

# Callbacks (SIMPLIFIED)
callbacks:
  model_checkpoint:
    dirpath: ${paths.output_dir}/checkpoints
    filename: openbhb_min_mem_epoch_{epoch:03d}
    monitor: val/loss
    mode: min
    save_top_k: 3  # Keep fewer checkpoints
    save_last: true
    every_n_epochs: 5  # Save less frequently
    auto_insert_metric_name: true

  early_stopping:
    monitor: val/loss
    patience: 20  # More patient (validation is less frequent)
    mode: min
    min_delta: 0.001

  # Disable model summary to save memory
  model_summary:
    max_depth: 1

# Logger configuration (MINIMAL)
logger:
  tensorboard:
    save_dir: ${paths.output_dir}/tensorboard
    # Don't log images every epoch
    # log_graph: false

# Additional memory-saving tips (not configurable here):
#
# 1. Use gradient checkpointing in model (requires code modification)
# 2. Clear CUDA cache periodically
# 3. Close other applications using GPU
# 4. Use CPU offloading if available
# 5. Consider using FlowLetSmall model instead of Base
#
# To use FlowLetSmall (even less memory):
#   model:
#     _target_: flowlet.flowlet.FlowLetSmall
#     # ... other params
