# OpenBHB Dataset Configuration
# Settings follow the FlowLet paper specifications
# Dataset: https://huggingface.co/datasets/freds0/OpenBHB-Dataset

_target_: flowlet.data.mri_datamodule.OpenBHBDataModule

# Data paths (OpenBHB from HuggingFace)
data_dir: /home/fred/Projetos/Einstein/openbhb_train_sample
metadata_file: /home/fred/Projetos/Einstein/openbhb_train_sample/train.tsv

# Data parameters
target_shape: [128, 128, 128]  # Resize from (182, 218, 182)
age_range: null  # Auto-infer from data

# DataLoader parameters (paper: batch_size=4)
batch_size: 4
num_workers: 4
pin_memory: true

# Split parameters (paper: 80% train, 20% validation, no test)
val_split: 0.2
test_split: 0.0

# Augmentation (paper: MONAI-based 3D rotations, intensity, noise)
augment_train: true
augment_val: false

# Memory optimization
cache_data: false

# Diagnosis filter (paper: only CN/control subjects)
filter_diagnosis: "control"

# Site information
include_site: false

# Reproducibility
seed: 42
