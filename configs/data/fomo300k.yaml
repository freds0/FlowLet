# Locally downloaded FOMO300K brain-age dataset.
# Samples without numeric age or without a local session ZIP are excluded.

_target_: flowlet.data.fomo300k_datamodule.FOMO300KDataModule

data_dir: /root/DATASETS/FOMO300K_brain_age

target_shape: [128, 128, 128]
age_range: [-17.0, 96.0]

batch_size: 4
num_workers: 4
pin_memory: true

val_split: 0.2
test_split: 0.0

augment_train: true
augment_val: false
cache_data: false
include_site: false

# Set for smoke tests, for example: data.max_samples=32.
max_samples: null

# Validate selected T1w members before creating train/validation splits.
validate_archives: true
validation_cache_file: /root/DATASETS/FOMO300K_brain_age/.flowlet_t1w_validation.csv
validation_workers: 4

# Secondary safeguard if a validated ZIP changes while training is running.
skip_corrupt_files: true
max_corrupt_retries: 8
seed: 42
