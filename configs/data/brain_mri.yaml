# Brain MRI DataModule Configuration
# For training FlowLet on brain MRI datasets

_target_: flowlet.data.mri_datamodule.MRIDataModule

name: brain_mri

# Data paths (override in experiment config)
data_dir: ???                    # Directory containing NIfTI files
train_metadata: ???              # CSV with columns: filename, age
val_metadata: null               # Optional separate validation metadata
test_metadata: null              # Optional separate test metadata

# Volume parameters
target_shape: [128, 128, 128]    # Target volume shape (D, H, W)
age_range: [18.0, 90.0]          # Age range for normalization

# DataLoader parameters
batch_size: 4
num_workers: 4
pin_memory: true

# Train/Val/Test split (if val_metadata not provided)
val_split: 0.1
test_split: 0.0

# Augmentation
augment_train: true
augment_val: false

# Caching
cache_data: false  # Set to true for small datasets to speed up training

seed: ${seed}

# Synthetic data (for testing without real data)
use_synthetic: false
synthetic_num_samples: 100
