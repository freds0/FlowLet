# Synthetic MRI DataModule Configuration
# For testing FlowLet without real MRI data

_target_: flowlet.data.mri_datamodule.MRIDataModule

name: synthetic_mri

# No real data paths needed
data_dir: null
train_metadata: null
val_metadata: null
test_metadata: null

# Volume parameters (smaller for faster testing)
target_shape: [64, 64, 64]
age_range: [18.0, 90.0]

# DataLoader parameters
batch_size: 2
num_workers: 2
pin_memory: true

# Split
val_split: 0.2
test_split: 0.0

# Augmentation
augment_train: false
augment_val: false

# No caching needed for synthetic
cache_data: false

seed: ${seed}

# Enable synthetic data
use_synthetic: true
synthetic_num_samples: 100
