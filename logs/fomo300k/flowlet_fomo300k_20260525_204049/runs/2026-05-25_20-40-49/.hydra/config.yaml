task_name: fomo300k
run_name: flowlet_fomo300k_${now:%Y%m%d_%H%M%S}
tags:
- fomo300k
- t1w
- haar
- rfm
- brain-age
train: true
test: false
ckpt_path: null
seed: 42
data:
  _target_: flowlet.data.fomo300k_datamodule.FOMO300KDataModule
  data_dir: /root/DATASETS/FOMO300K_brain_age
  target_shape:
  - 128
  - 128
  - 128
  age_range:
  - -17.0
  - 96.0
  batch_size: 4
  num_workers: 4
  pin_memory: true
  val_split: 0.2
  test_split: 0.0
  augment_train: true
  augment_val: false
  cache_data: false
  include_site: false
  max_samples: null
  seed: 42
model:
  _target_: flowlet.flowlet.FlowLet
  wavelet: haar
  wavelet_level: 1
  volume_shape:
  - 128
  - 128
  - 128
  hidden_dims:
  - 64
  - 128
  - 256
  - 512
  time_embed_dim: 256
  cond_embed_dim: 64
  num_res_blocks: 2
  attention_levels:
  - 2
  - 3
  dropout: 0.0
  sigma_min: 0.0001
  use_rectified_flow: true
  learning_rate: 3.0e-06
  weight_decay: 0.01
  warmup_steps: 0
  scheduler_type: cosine
  scheduler_eta_min: 1.0e-07
  n_sample_steps: 10
  data_mean: 0.0
  data_std: 1.0
  age_min: -17.0
  age_max: 96.0
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: ${model.learning_rate}
    weight_decay: ${model.weight_decay}
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  scheduler: null
callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: flowlet_fomo300k_epoch_{epoch:03d}
    monitor: val/loss
    verbose: false
    save_last: true
    save_top_k: 5
    mode: min
    auto_insert_metric_name: true
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: 1
    save_on_train_epoch_end: null
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: 3
  rich_progress_bar:
    _target_: lightning.pytorch.callbacks.RichProgressBar
  early_stopping:
    monitor: val/loss
    patience: 30
    mode: min
    min_delta: 0.0001
logger:
  tensorboard:
    _target_: lightning.pytorch.loggers.tensorboard.TensorBoardLogger
    save_dir: ${paths.output_dir}/tensorboard/
    name: null
    log_graph: false
    default_hp_metric: true
    prefix: ''
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  max_epochs: 200
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  check_val_every_n_epoch: 1
  deterministic: false
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${paths.root_dir}/data/
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
extras:
  ignore_warnings: false
  enforce_tags: true
  print_config: true
